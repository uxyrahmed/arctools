# Publishes each toolbox under toolboxes/ as its own GitHub Release, with a zip
# you can download, unzip and add to ArcGIS Pro.
#
# - On every push to main, each toolbox whose folder changed gets a new release.
#   A toolbox that has never been released gets its first one.
# - Tags are per toolbox: survey-location-map-v1.0, survey-location-map-v1.1, ...
#   The minor number goes up by one each release. To start a new major version,
#   put it in a VERSION file in the toolbox folder (for example "2.0").
# - Run it by hand from the Actions tab to re-release one toolbox (or "all").
name: Release toolboxes

on:
  push:
    branches: [main]
    paths:
      - "toolboxes/**"
      - "scripts/build_toolbox_zip.sh"
      - ".github/workflows/release-toolboxes.yml"
  workflow_dispatch:
    inputs:
      toolbox:
        description: 'Toolbox folder name to release, or "all"'
        required: true
        default: all

permissions:
  contents: write

concurrency:
  group: release-toolboxes
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release changed toolboxes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REQUESTED: ${{ github.event.inputs.toolbox }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          for dir in toolboxes/*/; do
            name="$(basename "$dir")"
            case "$name" in _*|.*) continue ;; esac   # skip _template

            slug="$(echo "$name" | tr '_ ' '--' | tr '[:upper:]' '[:lower:]')"
            last_tag="$(git tag --list "$slug-v*" --sort=-v:refname | head -n1)"

            # Decide whether this toolbox needs a release.
            release=no
            if [ "$EVENT" = "workflow_dispatch" ]; then
              if [ "$REQUESTED" = "all" ] || [ "$REQUESTED" = "$name" ] || [ "$REQUESTED" = "$slug" ]; then
                release=yes
              fi
            elif [ -z "$last_tag" ]; then
              release=yes
            elif ! git diff --quiet "$last_tag" HEAD -- "$dir"; then
              release=yes
            fi
            if [ "$release" = no ]; then
              echo "$name: no changes since $last_tag"
              continue
            fi

            # Work out the next version.
            want=""
            [ -f "$dir/VERSION" ] && want="$(tr -d ' \r\n' < "$dir/VERSION")"
            if [ -z "$last_tag" ]; then
              version="${want:-1.0}"
            else
              last="${last_tag#"$slug-v"}"
              major="${last%%.*}"; minor="${last#*.}"; minor="${minor%%.*}"
              version="$major.$((minor + 1))"
              if [ -n "$want" ]; then
                want_major="${want%%.*}"
                if [ "$want_major" -gt "$major" ]; then version="$want"; fi
              fi
            fi
            tag="$slug-v$version"

            # Notes: the commits that touched this toolbox since the last release.
            title="$(sed -n 's/^# *//p;q' "$dir/README.md" 2>/dev/null || true)"
            [ -n "$title" ] || title="$name"
            {
              echo "Download **${name}.zip** below, unzip it and add the \`.pyt\` inside to ArcGIS Pro (Catalog > Toolboxes > Add Toolbox)."
              echo "If an older copy is already added, remove it or unzip over it, then right-click the toolbox and choose Refresh."
              echo
              echo "### Changes"
              if [ -n "$last_tag" ]; then
                git log --no-merges --format='- %s' "$last_tag..HEAD" -- "$dir"
              else
                echo "- First release."
              fi
            } > notes.md

            mkdir -p dist
            scripts/build_toolbox_zip.sh "$name" "dist/${name}.zip"

            gh release create "$tag" "dist/${name}.zip" \
              --target "$GITHUB_SHA" \
              --title "$title v$version" \
              --notes-file notes.md \
              --latest=false
            echo "$name: released $tag"
          done
